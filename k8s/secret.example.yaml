# ==============================================================================
# Bandhoo Kubernetes Secret Template (Example)
# DO NOT COMMIT REAL API KEYS OR PASSWORDS TO VERSION CONTROL.
#
# To create this secret imperatively from the command line:
#   kubectl create secret generic bandhoo-secrets \
#     --from-literal=GEMINI_API_KEY="your-real-gemini-api-key"
#
# Or copy this file to k8s/secret.yaml (ensure it is .gitignored), replace the
# placeholder below, and apply it with:
#   kubectl apply -f k8s/secret.yaml
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: bandhoo-secrets
  labels:
    app: bandhoo-backend
    app.kubernetes.io/name: bandhoo
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: bandhoo-mlops
type: Opaque
stringData:
  # Optional: Google Gemini API Key for hybrid LLM reasoning.
  # If omitted, Bandhoo operates offline using deterministic BM25 lexical retrieval.
  GEMINI_API_KEY: "your_gemini_api_key_here"

