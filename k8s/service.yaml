apiVersion: v1
kind: Service
metadata:
  name: bandhoo-backend-service
  labels:
    app: bandhoo-backend
    app.kubernetes.io/name: bandhoo
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: bandhoo-mlops
spec:
  type: NodePort
  selector:
    app: bandhoo-backend
  ports:
    - name: http
      port: 8001
      targetPort: 8001
      nodePort: 30081
      protocol: TCP

