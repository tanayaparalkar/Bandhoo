# ==============================================================================
# Grafana Dashboard Provider Configuration for Bandhoo Monitoring
# ==============================================================================

apiVersion: 1

providers:
  - name: "Bandhoo Dashboards"
    orgId: 1
    folder: "Bandhoo"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards

