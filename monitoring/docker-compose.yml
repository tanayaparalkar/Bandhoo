# ==============================================================================
# Bandhoo Local Prometheus + Grafana Monitoring Stack
# Scrapes live telemetry from AWS ECS Fargate Backend (13.232.16.110:8001/metrics)
# ==============================================================================

version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: bandhoo-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle' # Enables hot-reloading target via: curl -X POST http://localhost:9090/-/reload
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - bandhoo-monitoring-net

  grafana:
    image: grafana/grafana:10.4.1
    container_name: bandhoo-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be configured in monitoring/.env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/bandhoo-overview.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - bandhoo-monitoring-net

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  bandhoo-monitoring-net:
    driver: bridge

